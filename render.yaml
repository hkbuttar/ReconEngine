# Render Blueprint for the FastAPI backend. Render has no managed SQL
# Server offering (Postgres/Redis/Key-Value only), and SQL Server can't
# run as a Render container service at all -- confirmed by an actual
# deploy attempt: Render's sandboxed container runtime drops Linux
# capabilities sqlservr's binary needs at startup ("Operation not
# permitted" on exec, a documented Render platform limitation hit by
# other unrelated images too, not something fixable via this file). SQL
# Server runs on Fly.io instead (fly.toml, same sql/deploy/ image), wired
# in via RECONENGINE_ODBC_CONNECTION_STRING -- see DEPLOYMENT.md.
services:
  - type: web
    name: reconengine-backend
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: RECONENGINE_ODBC_CONNECTION_STRING
        sync: false   # set manually in the Render dashboard -- points at the Fly.io SQL Server app, see DEPLOYMENT.md
      - key: ANTHROPIC_API_KEY
        sync: false   # set manually -- required only for GET /query
